<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebMCP Census demo page</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
      h1 { font-size: 28px; margin-bottom: 4px; }
      form { border: 2px solid #000; padding: 16px; box-shadow: 4px 4px 0 #000; margin-top: 24px; }
      label { display: block; font-weight: 600; margin-top: 12px; }
      input { width: 100%; padding: 8px; border: 2px solid #000; box-sizing: border-box; font-size: 16px; }
      button { margin-top: 16px; padding: 10px 18px; font-size: 16px; font-weight: 700; background: #000; color: #fff; border: 0; cursor: pointer; }
      #status { margin-top: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>WebMCP Census demo</h1>
    <p>
      This page ships inside the example and registers two harmless tools. Nothing here leaves
      the page: no network requests, no storage.
    </p>

    <form
      id="badge-form"
      toolname="request_census_badge"
      tooldescription="Prepare a 'checked by WebMCP Census' badge for a site. A human must press Submit."
    >
      <strong>Request a census badge</strong>
      <label for="site">Site</label>
      <input id="site" name="site" required toolparamdescription="Hostname of the site, e.g. example.com" />
      <label for="contact">Your name</label>
      <input id="contact" name="contact" required toolparamdescription="Who is asking for the badge" />
      <button type="submit">Submit</button>
      <p id="status"></p>
    </form>

    <script>
      const modelContext = document.modelContext ?? navigator.modelContext;
      if (!modelContext) {
        document.getElementById("status").textContent = "WebMCP is not available in this browser.";
      } else {
        modelContext.registerTool({
          name: "get_census_fact",
          title: "Census fact",
          description: "Returns a static fact about WebMCP. Has no side effects.",
          inputSchema: { type: "object", properties: {} },
          annotations: { readOnlyHint: true },
          execute: async () => ({
            fact: "WebMCP lets a page declare tools with a name, description, and JSON Schema.",
            servedAt: new Date().toISOString(),
          }),
        });
      }

      document.getElementById("badge-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.target);
        const badge = { badge: `checked-by-webmcp-census:${data.get("site")}`, requestedBy: data.get("contact") };
        document.getElementById("status").textContent = `Submitted. Badge: ${badge.badge}`;
        if (typeof event.respondWith === "function") event.respondWith(Promise.resolve(badge));
      });
    </script>
  </body>
</html>
